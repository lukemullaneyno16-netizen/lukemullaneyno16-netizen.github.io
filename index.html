<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOATANG Crowdfunding Launch Hub</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f7f8fa;color:#0b1f2a}.loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.spinner{width:32px;height:32px;border:3px solid #dfe6ea;border-top-color:#0f5f7a;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}p{color:#667789;font-size:14px}</style></head><body><div class="loading"><div><div class="spinner"></div><strong>Loading BOATANG Launch Hub…</strong><p>Public example website</p></div></div><script>(async()=>{try{const files=['site_big_0.txt','site_big_1.txt','site_big_2.txt','site_big_3.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=1').then(r=>{if(!r.ok)throw new Error('Could not load '+f);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('This browser is too old to open the site. Please use a current version of Chrome, Safari, Edge or Firefox.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><strong>Could not load the BOATANG website.</strong><p>'+e.message+'</p></div></div>'}})();</script></body></html>
