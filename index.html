<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BOATANG Crowdfunding Planner</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#06172b;color:#fff}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.18);border-top-color:#5bd1ff;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
    @keyframes s{to{transform:rotate(360deg)}}
    p{color:#bfd0e2;font-size:14px}
  </style>
</head>
<body>
  <div class="loading"><div><div class="spinner"></div><strong>Loading BOATANG Crowdfunding Planner…</strong><p>Interactive crowdfunding calculator</p></div></div>
  <script>
    (async()=>{
      try{
        const files=['site_big_0.txt','site_big_1.txt','site_big_2.txt','site_big_3.txt'];
        const parts=await Promise.all(files.map(f=>fetch(f+'?v=2').then(r=>{if(!r.ok)throw new Error('Could not load calculator data');return r.text()})));
        const packed=parts.join('').replace(/\s/g,'');
        const bin=atob(packed);
        const bytes=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
        if(!('DecompressionStream' in window))throw new Error('Please use a current version of Chrome, Safari, Edge or Firefox.');
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const hubHtml=await new Response(stream).text();
        const doc=new DOMParser().parseFromString(hubHtml,'text/html');
        const plannerFrame=doc.querySelector('iframe[title="BOATANG Crowdfunding Planner"]');
        if(!plannerFrame)throw new Error('Planner not found');
        const src=plannerFrame.getAttribute('src')||'';
        const prefix='data:text/html;base64,';
        if(!src.startsWith(prefix))throw new Error('Planner data is invalid');
        const plannerBin=atob(src.slice(prefix.length));
        const plannerBytes=new Uint8Array(plannerBin.length);
        for(let i=0;i<plannerBin.length;i++)plannerBytes[i]=plannerBin.charCodeAt(i);
        const plannerHtml=new TextDecoder('utf-8').decode(plannerBytes);
        document.open();
        document.write(plannerHtml);
        document.close();
      }catch(e){
        document.body.innerHTML='<div class="loading"><div><strong>Could not load the BOATANG Crowdfunding Planner.</strong><p>'+e.message+'</p></div></div>';
      }
    })();
  </script>
</body>
</html>
